<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src data:">
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: crosshair; }
#panes { position: absolute; inset: 0; }
.pane { position: absolute; overflow: hidden; }
.pane.active::after { content: ""; position: absolute; inset: 0; z-index: 3; box-shadow: inset 0 0 0 1px rgba(200, 255, 220, 0.45); pointer-events: none; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.pick { position: absolute; z-index: 4; box-sizing: border-box; padding: 0 6px; font: calc(11px * var(--viz-text, 1))/calc(18px * var(--viz-text, 1)) "DejaVu Sans Mono", monospace; color: rgba(200, 255, 220, 0.7); background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(200, 255, 220, 0.3); border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.pick:hover, .pick.open { color: rgba(225, 255, 235, 0.95); border-color: rgba(200, 255, 220, 0.65); }
#menu { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
#menu .item { position: absolute; box-sizing: border-box; padding: 0 8px; font: calc(11px * var(--viz-text, 1))/calc(18px * var(--viz-text, 1)) "DejaVu Sans Mono", monospace; color: rgba(200, 255, 220, 0.8); background: rgba(6, 12, 9, 0.92); white-space: pre; overflow: hidden; text-overflow: ellipsis; cursor: pointer; pointer-events: auto; }
#menu .item:hover { background: rgba(36, 64, 46, 0.96); color: #fff; }
#menu .item.current { color: #fff; background: rgba(28, 86, 52, 0.96); }
.mode { position: absolute; left: 8px; right: 8px; bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 2; font: calc(11px * var(--viz-text, 1)) "DejaVu Sans Mono", monospace; color: rgba(200, 255, 220, 0.55); pointer-events: none; }
</style>
</head>
<body>
<div id="panes"></div>
<div id="menu"></div>
<script src="../../node_modules/butterchurn/lib/butterchurn.min.js"></script>
<script src="modes.js"></script>
